spring.application.name=tarefas-api
server.port=${PORT:8080}

# Configuração externa: valores vêm de variáveis de ambiente (com padrão para desenvolvimento local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tarefas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Logs
logging.level.root=INFO
logging.level.br.edu.tarefas=${LOG_LEVEL:INFO}

# Actuator: expor somente o necessário
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=tarefas-api
info.app.version=1.0.0
