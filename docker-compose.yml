services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-tarefas}
      POSTGRES_USER: ${DB_USER:-tarefas_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-troque_esta_senha}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tarefas_user} -d ${DB_NAME:-tarefas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-tarefas}
      DB_USER: ${DB_USER:-tarefas_user}
      DB_PASSWORD: ${DB_PASSWORD:-troque_esta_senha}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
